name: Actualizar datos Loreto

on:
  workflow_dispatch:
  schedule:
    - cron: "7 16 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray pyarrow pyreadr google-api-python-client google-auth google-auth-httplib2 h5netcdf h5py scipy requests openpyxl

      - name: Ejecutar actualización SONICS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GPKG_PATH: Data/estaciones_hidrometricas_loreto_latlong_COMID_actualizado.gpkg
        run: |
          python scripts/01_actualizar_sonics_ftp.py

      - name: Ejecutar actualización observado HidroMet
        env:
          OBS_DRIVE_FOLDER_ID: ${{ secrets.OBS_DRIVE_FOLDER_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          GPKG_PATH: Data/estaciones_hidrometricas_loreto_latlong_COMID_actualizado.gpkg
        run: |
          python scripts/02_actualizar_observado_hidromet.py

      - name: Guardar cache actualizado en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add backend/cache/.gitkeep
          git add backend/cache/hist_filtrado.parquet
          git add backend/cache/fore_filtrado.parquet
          git add backend/cache/observado_estaciones.parquet
          git add backend/cache/observado_estaciones.csv

          if git diff --cached --quiet; then
            echo "No hay cambios en backend/cache."
          else
            git commit -m "Actualizar cache SONICS y observado Loreto"
            git push
          fi
