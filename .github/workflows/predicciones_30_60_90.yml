name: Actualizar predicciones 30 60 90

# 13:00 hora de Peru = 18:00 UTC.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

# Esta Action no necesita escribir en el repositorio: actualiza los Excel
# existentes en Drive usando files.update sobre su mismo file_id.
permissions:
  contents: write

concurrency:
  group: actualizar-predicciones-30-60-90
  cancel-in-progress: false

jobs:
  actualizar-predicciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del actualizador
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests openpyxl google-api-python-client google-auth google-auth-httplib2

      - name: Validar secretos de predicciones
        env:
          PRED_DRIVE_FOLDER_ID: ${{ secrets.PRED_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: |
          test -n "$PRED_DRIVE_FOLDER_ID"
          test -n "$GOOGLE_SERVICE_JSON"

      - name: Actualizar Excel de predicciones en Drive
        env:
          PRED_DRIVE_FOLDER_ID: ${{ secrets.PRED_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          PRED_DRIVE_WRITE: "true"
        run: |
          python scripts/12_actualizar_predicciones_drive.py

      - name: Calcular pronósticos 30 60 90
        run: |
          python scripts/13_pronostico_30_60_90_analogos.py

      - name: Publicar salida diaria para el frontend
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f backend/predicciones_30_60_90/output/pronostico_30_60_90_actual.parquet
          git add -f backend/predicciones_30_60_90/output/pronostico_30_60_90_actual.csv
          git add -f backend/predicciones_30_60_90/output/resumen_pronostico_30_60_90.csv
          if git diff --cached --quiet; then
            echo "No cambió la salida diaria de predicciones."
          else
            git commit -m "Actualizar pronosticos 30 60 90"
            git pull --rebase origin main
            git push origin main
          fi

